[package]
name = "aedt-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = { version = "=0.20.1", default-features = false }
crossbeam-channel = "0.5"
rig-basics = { version = "=0.47.1", default-features = false }
rig-harness = "=0.47.1"
rig-http = { version = "=0.47.1", default-features = false, features = ["tokio"] }
rig-rmcp = "=0.47.1"
rmcp = { version = "=3.12.0", features = ["transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "process", "sync"] }
