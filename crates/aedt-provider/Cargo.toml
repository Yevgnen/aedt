[package]
name = "aedt-provider"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.43.0", default-features = false, features = ["chat-completion", "responses", "rustls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
nsh-core = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
