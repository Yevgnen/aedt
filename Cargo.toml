[package]
name = "aedt"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/aedt-store", "crates/aedt-ui"]

[dependencies]
aedt-store = { version = "0.1.0", path = "crates/aedt-store" }
aedt-ui = { version = "0.1.0", path = "crates/aedt-ui" }
async-openai = { version = "0.43.0", default-features = false, features = ["responses", "rustls"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
env_logger = "0.11.12"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
nsh-base = "0.7.0"
nsh-core = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "0.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = "0.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = "0.7.0"
