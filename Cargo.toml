[package]
name = "aedt"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.43.0", default-features = false, features = ["responses", "rustls"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
env_logger = "0.11.12"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
nsh-base = "0.7.0"
nsh-core = "0.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "0.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = "0.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = "0.7.0"
