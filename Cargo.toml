[package]
name = "aedt"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/aedt-provider",
    "crates/aedt-settings",
    "crates/aedt-store",
    "crates/aedt-ui",
]

[dependencies]
aedt-provider = { version = "0.1.0", path = "crates/aedt-provider" }
aedt-settings = { version = "0.1.0", path = "crates/aedt-settings" }
aedt-store = { version = "0.1.0", path = "crates/aedt-store" }
aedt-ui = { version = "0.1.0", path = "crates/aedt-ui" }
env_logger = "0.11.12"
nsh-base = "0.7.0"
nsh-core = "0.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "0.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = "0.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = "0.7.0"
